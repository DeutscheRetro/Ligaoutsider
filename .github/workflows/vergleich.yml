name: Modellvergleich

# Schreibt dieselben Geschichten mit mehreren Modell-/Effort-Varianten (vergleich.py),
# nur über das Abo und ohne Veröffentlichung. Ergebnis als Artefakt "vergleich".
on:
  workflow_dispatch:
    inputs:
      anzahl:
        description: 'Anzahl Geschichten'
        required: false
        default: '5'

env:
  TZ: Europe/Berlin

jobs:
  vergleich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Vergleich
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VERGLEICH_ANZAHL: ${{ github.event.inputs.anzahl }}
        run: python vergleich.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vergleich
          path: vergleich.json
