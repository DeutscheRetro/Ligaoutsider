name: Neue Artikel generieren

on:
  # GitHub startet geplante Laeufe oft Stunden zu spaet und laesst einzelne ganz
  # ausfallen. Deshalb mehr Startzeiten als noetig – veroeffentlicht wird ohnehin
  # nur nach Zeitabstand (siehe ABSTAND_STUNDEN), nicht bei jedem Lauf.
  schedule:
    - cron: '0 5 * * *'     # 07:00 (UTC+2)
    - cron: '0 6 * * *'     # 08:00 – erste Veroeffentlichung des Tages
    - cron: '0 7 * * *'     # 09:00
    - cron: '0 9 * * *'     # 11:00
    - cron: '0 11 * * *'    # 13:00
    - cron: '0 13 * * *'    # 15:00
    - cron: '0 16 * * *'    # 18:00
    - cron: '0 18 * * *'    # 20:00
    - cron: '0 20 * * 5,6,0'  # 22:00, Fr/Sa/So – nach den Abendspielen
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manueller oder externer Trigger'
        required: false
        default: 'manuell'
      veroeffentlichen:
        description: 'Danach auf Netlify veröffentlichen (kostet ein Deploy-Guthaben)'
        type: boolean
        required: false
        default: true

# Netlify berechnet jede Veröffentlichung. Deshalb speichert jeder Lauf seinen
# Stand mit "[skip netlify]" (kostenlos). Veröffentlicht wird erst, wenn die
# letzte Veröffentlichung mindestens ABSTAND_STUNDEN her ist – das ergibt rund
# zwei Deploys am Tag und funktioniert auch, wenn GitHub die Läufe Stunden zu
# spät startet (fester Zeitplan hatte dann den falschen Lauf erwischt).
env:
  TZ: Europe/Berlin
  # Zwei Veroeffentlichungen am Tag: die erste ab 8 Uhr, die zweite ab 15 Uhr.
  # Als Regel formuliert (fruehestens 8 Uhr + 6 Stunden Abstand), damit sie auch
  # greift, wenn GitHub einen Lauf erst Stunden spaeter startet.
  # 1.000 Credits/Monat aus dem Tarif reichen fuer rund 60-65 Veroeffentlichungen.
  AB_STUNDE: '8'
  ABSTAND_STUNDEN: '6'
  # Ausnahme: der Lauf nach den Abendspielen veroeffentlicht immer
  IMMER_VEROEFFENTLICHEN_BEI: '0 20 * * 5,6,0'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: generate-pipeline
      cancel-in-progress: true

    steps:
      - name: Code holen
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          pip install -r requirements.txt
          pip list | grep -E 'trafilatura|rapidfuzz|feedparser|anthropic|requests'

      - name: Artikel generieren
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          KICKBASE_EMAIL:       ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD:    ${{ secrets.KICKBASE_PASSWORD }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:      ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:      ${{ secrets.REDDIT_PASSWORD }}
        run: python generate.py

      - name: Änderungen committen & pushen
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUELL_VEROEFFENTLICHEN: ${{ github.event.inputs.veroeffentlichen }}
        run: |
          git config user.name  "Ligaoutsider Bot"
          git config user.email "bot@ligaoutsider.de"

          # Soll dieser Lauf veröffentlichen? Maßstab ist der Abstand zur letzten
          # Veröffentlichung (= letzter Commit ohne [skip netlify]).
          LETZTE=$(git log -200 --format='%H %ct %s' | grep -v '\[skip netlify\]' | head -1 | cut -d' ' -f2)
          JETZT=$(date +%s)
          STUNDEN=$(( (JETZT - ${LETZTE:-0}) / 3600 ))
          STUNDE=$(TZ=Europe/Berlin date +%-H)
          VEROEFFENTLICHEN=false
          [ "$STUNDEN" -ge "$ABSTAND_STUNDEN" ] && [ "$STUNDE" -ge "$AB_STUNDE" ] && VEROEFFENTLICHEN=true
          [ "$SCHEDULE" = "$IMMER_VEROEFFENTLICHEN_BEI" ] && VEROEFFENTLICHEN=true
          [ "$MANUELL_VEROEFFENTLICHEN" = "true" ] && VEROEFFENTLICHEN=true
          echo "Letzte Veröffentlichung vor ${STUNDEN}h, jetzt ${STUNDE} Uhr → veröffentlichen: $VEROEFFENTLICHEN (schedule='$SCHEDULE')"

          git add feed.json artikel/ data/ logs/ sitemap.xml news-sitemap.xml rss.xml og/ || true
          [ -f kickbase.json ] && git add kickbase.json || true
          [ -f comunio.json ] && git add comunio.json || true
          [ -f aufstellung.json ] && git add aufstellung.json || true
          [ -f spieler_db.json ] && git add spieler_db.json || true
          [ -f spieler_news.json ] && git add spieler_news.json || true
          [ -d spieler ] && git add spieler/ || true

          if ! git diff --staged --quiet; then
            if [ "$VEROEFFENTLICHEN" = "true" ]; then
              git commit -m "🤖 Update $(date +'%d.%m.%Y %H:%M')"
            else
              git commit -m "🤖 Update $(date +'%d.%m.%Y %H:%M') [skip netlify]"
            fi
          elif [ "$VEROEFFENTLICHEN" = "true" ] && git log -1 --format=%s | grep -q '\[skip netlify\]'; then
            # Nichts Neues in diesem Lauf, aber gesammelte Änderungen warten noch
            git commit --allow-empty -m "🚀 Veröffentlichung $(date +'%d.%m.%Y %H:%M')"
          else
            echo "Nichts zu speichern oder zu veröffentlichen"
            exit 0
          fi

          git stash -u 2>/dev/null || true
          git pull --rebase -X theirs origin main
          git stash pop 2>/dev/null || true
          git push
          [ "$VEROEFFENTLICHEN" = "true" ] && echo "veroeffentlicht=true" >> "$GITHUB_ENV" || true

      # Prüft nach jedem Lauf, ob die Seite erreichbar ist. Am 28.09. hat Netlify
      # einen Deploy ohne Weiterleitungsregeln ausgeliefert -> jede Seite gab 500.
      # Ein erneuter Build desselben Stands hat das behoben. Deshalb: bei 500
      # einmal neu bauen lassen; hilft das nicht, schlägt der Lauf fehl (GitHub
      # schickt dann eine Mail).
      - name: Seite erreichbar?
        if: always()
        run: |
          pruefe() {
            for u in / /robots.txt /archiv.html; do
              c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://ligaoutsider.de$u")
              [ "$c" = "200" ] || { echo "$u -> $c"; return 1; }
            done
            return 0
          }
          stabil_kaputt() {
            for i in 1 2 3; do pruefe && return 1; sleep 30; done
            return 0
          }
          # Nach einer Veröffentlichung erst den neuen Deploy abwarten
          [ "${veroeffentlicht:-}" = "true" ] && sleep 120
          if ! stabil_kaputt; then echo "✅ Seite erreichbar"; exit 0; fi

          echo "⚠️ Seite liefert Fehler – stoße neuen Deploy an"
          git config user.name  "Ligaoutsider Bot"
          git config user.email "bot@ligaoutsider.de"
          git pull --rebase -X theirs origin main
          git commit --allow-empty -m "🔁 Neu-Deploy: Seite lieferte Fehler"
          git push
          sleep 150
          if stabil_kaputt; then
            echo "::error::ligaoutsider.de liefert auch nach Neu-Deploy Fehler – bitte in Netlify prüfen"
            exit 1
          fi
          echo "✅ Seite nach Neu-Deploy wieder erreichbar"

      # Neue Artikel auf Bluesky/Telegram posten – erst wenn ihre Seite live ist
      - name: Social Media
        if: always()
        env:
          BLUESKY_HANDLE:       ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:     ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python social.py || true
          git config user.name  "Ligaoutsider Bot"
          git config user.email "bot@ligaoutsider.de"
          git add data/social_queue.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "📣 Social-Warteschlange [skip netlify]"
            git pull --rebase -X theirs origin main && git push || true
          fi
