name: Neue Artikel generieren

on:
  # 12 Läufe am Tag, Berliner Zeit: 06:00 08:00 10:00 12:00 13:30 15:00 16:30 18:00
  # 19:30 21:00 23:00 01:00 (wie ki_budget.LAUFPLAN_BERLIN). GitHub plant nur in UTC,
  # deshalb steht jede Zeit für Sommer- und Winterzeit da; der Job "zeitplan" lässt
  # nur die zur aktuellen Berliner Zeit passende Variante laufen.
  # Jeder Lauf mit neuen Inhalten wird veröffentlicht (Cloudflare baut bei jedem Push).
  schedule:
    - cron: '0 23 * * *'    # 01:00 Sommerzeit
    - cron: '0 0 * * *'     # 01:00 Winterzeit
    - cron: '0 4 * * *'     # 06:00 Sommerzeit
    - cron: '0 5 * * *'     # 06:00 Winterzeit
    - cron: '0 6 * * *'     # 08:00 Sommerzeit
    - cron: '0 7 * * *'     # 08:00 Winterzeit
    - cron: '0 8 * * *'     # 10:00 Sommerzeit
    - cron: '0 9 * * *'     # 10:00 Winterzeit
    - cron: '0 10 * * *'    # 12:00 Sommerzeit
    - cron: '0 11 * * *'    # 12:00 Winterzeit
    - cron: '30 11 * * *'   # 13:30 Sommerzeit
    - cron: '30 12 * * *'   # 13:30 Winterzeit
    - cron: '0 13 * * *'    # 15:00 Sommerzeit
    - cron: '0 14 * * *'    # 15:00 Winterzeit
    - cron: '30 14 * * *'   # 16:30 Sommerzeit
    - cron: '30 15 * * *'   # 16:30 Winterzeit
    - cron: '0 16 * * *'    # 18:00 Sommerzeit
    - cron: '0 17 * * *'    # 18:00 Winterzeit
    - cron: '30 17 * * *'   # 19:30 Sommerzeit
    - cron: '30 18 * * *'   # 19:30 Winterzeit
    - cron: '0 19 * * *'    # 21:00 Sommerzeit
    - cron: '0 20 * * *'    # 21:00 Winterzeit
    - cron: '0 21 * * *'    # 23:00 Sommerzeit
    - cron: '0 22 * * *'    # 23:00 Winterzeit
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manueller oder externer Trigger'
        required: false
        default: 'manuell'

env:
  TZ: Europe/Berlin

jobs:
  zeitplan:
    runs-on: ubuntu-latest
    outputs:
      los: ${{ steps.pruefen.outputs.los }}
    steps:
      - id: pruefen
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Manuell gestartet: immer. Geplant: nur die Sommer- bzw. Winterzeit-Variante, die gerade gilt.
          SOMMER=('0 23 * * *' '0 4 * * *' '0 6 * * *' '0 8 * * *' '0 10 * * *' '30 11 * * *' '0 13 * * *' '30 14 * * *' '0 16 * * *' '30 17 * * *' '0 19 * * *' '0 21 * * *')
          WINTER=('0 0 * * *' '0 5 * * *' '0 7 * * *' '0 9 * * *' '0 11 * * *' '30 12 * * *' '0 14 * * *' '30 15 * * *' '0 17 * * *' '30 18 * * *' '0 20 * * *' '0 22 * * *')
          LOS=false
          if [ -z "$SCHEDULE" ]; then LOS=true; fi
          if [ "$(TZ=Europe/Berlin date +%z)" = "+0200" ]; then LISTE=("${SOMMER[@]}"); else LISTE=("${WINTER[@]}"); fi
          for c in "${LISTE[@]}"; do [ "$c" = "$SCHEDULE" ] && LOS=true; done
          echo "schedule='$SCHEDULE' → los=$LOS"
          echo "los=$LOS" >> "$GITHUB_OUTPUT"

  generate:
    needs: zeitplan
    if: needs.zeitplan.outputs.los == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Nie einen laufenden Lauf abbrechen: er hat womöglich schon für Artikel bezahlt,
    # und ohne Commit fehlen die Kosten in data/api_kosten.json
    concurrency:
      group: generate-pipeline
      cancel-in-progress: false

    steps:
      - name: Code holen
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          pip install -r requirements.txt
          pip list | grep -E 'trafilatura|rapidfuzz|feedparser|anthropic|requests'

      # Claude-Code-CLI: damit laufen die KI-Aufrufe über das Claude-Abo
      # (Secret CLAUDE_CODE_OAUTH_TOKEN, erzeugt mit "claude setup-token").
      # Ohne Secret oder bei erschöpftem Kontingent geht es über die API.
      - name: Claude Code installieren
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code && claude --version
          # Diagnose ohne den Wert zu zeigen: Länge und Präfix (sk-ant-oat01-…)
          T="$CLAUDE_CODE_OAUTH_TOKEN"
          echo "Abo-Token: ${#T} Zeichen, Präfix ${T:0:13}, Leerzeichen/Umbrüche: $(printf %s "$T" | tr -cd ' \n\r\t' | wc -c)"
          echo "Antworte nur mit OK" | env -u ANTHROPIC_API_KEY claude -p --model haiku --tools "" --setting-sources "" || true

      - name: Artikel generieren
        env:
          # Fester Deckel für Claude-Kosten pro Kalendermonat (siehe ki_budget.py).
          # Die Lauf-Zeiten oben stehen auch in ki_budget.LAUFPLAN_BERLIN.
          # 23 USD ≈ 20 EUR, das ganze Monatsbudget (Hosting kostet nichts mehr)
          MONATSBUDGET_USD:     '23'
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KICKBASE_EMAIL:       ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD:    ${{ secrets.KICKBASE_PASSWORD }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:      ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:      ${{ secrets.REDDIT_PASSWORD }}
        run: python generate.py

      - name: Änderungen committen & pushen
        run: |
          git config user.name  "Ligaoutsider Bot"
          git config user.email "bot@ligaoutsider.de"

          git add feed.json artikel/ data/ logs/ sitemap.xml news-sitemap.xml rss.xml og/ || true
          [ -f kickbase.json ] && git add kickbase.json || true
          [ -f comunio.json ] && git add comunio.json || true
          [ -f aufstellung.json ] && git add aufstellung.json || true
          [ -f spieler_db.json ] && git add spieler_db.json || true
          [ -f spieler_news.json ] && git add spieler_news.json || true
          [ -d spieler ] && git add spieler/ || true

          if git diff --staged --quiet; then
            echo "Nichts zu speichern"
            exit 0
          fi
          git commit -m "🤖 Update $(date +'%d.%m.%Y %H:%M')"

          git stash -u 2>/dev/null || true
          git pull --rebase -X theirs origin main
          git stash pop 2>/dev/null || true
          git push
          echo "veroeffentlicht=true" >> "$GITHUB_ENV"

      # Prüft nach jedem Lauf, ob die Seite erreichbar ist. Liefert sie Fehler,
      # wird einmal neu gebaut; hilft das nicht, schlägt der Lauf fehl (GitHub
      # schickt dann eine Mail).
      - name: Seite erreichbar?
        if: always()
        run: |
          pruefe() {
            for u in / /robots.txt /archiv.html; do
              c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://ligaoutsider.de$u")
              [ "$c" = "200" ] || { echo "$u -> $c"; return 1; }
            done
            return 0
          }
          stabil_kaputt() {
            for i in 1 2 3; do pruefe && return 1; sleep 30; done
            return 0
          }
          # Nach einer Veröffentlichung erst den neuen Deploy abwarten
          [ "${veroeffentlicht:-}" = "true" ] && sleep 120
          if ! stabil_kaputt; then echo "✅ Seite erreichbar"; exit 0; fi

          echo "⚠️ Seite liefert Fehler – stoße neuen Deploy an"
          git config user.name  "Ligaoutsider Bot"
          git config user.email "bot@ligaoutsider.de"
          git pull --rebase -X theirs origin main
          git commit --allow-empty -m "🔁 Neu-Deploy: Seite lieferte Fehler"
          git push
          sleep 150
          if stabil_kaputt; then
            echo "::error::ligaoutsider.de liefert auch nach Neu-Deploy Fehler – bitte in Cloudflare (Workers & Pages → ligaoutsider → Deployments) prüfen"
            exit 1
          fi
          echo "✅ Seite nach Neu-Deploy wieder erreichbar"

      # Neue Artikel auf Bluesky/Telegram posten – erst wenn ihre Seite live ist
      - name: Social Media
        if: always()
        env:
          BLUESKY_HANDLE:       ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:     ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python social.py || true
          git config user.name  "Ligaoutsider Bot"
          git config user.email "bot@ligaoutsider.de"
          git add data/social_queue.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "📣 Social-Warteschlange"
            git pull --rebase -X theirs origin main && git push || true
          fi
