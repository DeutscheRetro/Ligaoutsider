<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Avatar-Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>body{background:#111;color:#eee;font-family:Inter,system-ui,sans-serif;margin:24px}
.z{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.k{background:#1b1b1b;border-radius:10px;padding:12px;text-align:center;font-size:12px}
.k div{display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}h2{font-size:14px;margin:26px 0 8px;color:#e8c000}
.hell{background:#f4f4f4}.hell .k{background:#fff;color:#111}</style></head><body>
<h2>Trikot (64 px / 28 px) und Kreis (64 px / 28 px) – dunkler Hintergrund</h2><div class="z" id="z"></div>
<h2>Ohne Rückennummer (Initialen) und helle Seite</h2><div class="z hell" id="h"></div>
<script src="avatar.js"></script><script>
const namen={bayern:['Harry Kane',9],dortmund:['Serhou Guirassy',9],leverkusen:['Patrik Schick',14],leipzig:['Xavi Simons',10],frankfurt:['Jonathan Burkardt',9],stuttgart:['Deniz Undav',26],freiburg:['Vincenzo Grifo',32],hoffenheim:['Andrej Kramaric',27],werder:['Karl Hein',1],gladbach:['Franck Honorat',9],mainz:['Nadiem Amiri',8],augsburg:['Alexis Claude-Maurice',10],union:['Oliver Burke',7],koeln:['Marvin Schwäbe',1],hsv:['Miro Muheim',3],schalke:['Emil Højlund',9],paderborn:['Sven Michel',7],elversberg:['Lasse Günther',15]};
const k=(l,o)=>`<div class="k"><div>${LoAvatar.html({...o,size:64})}${LoAvatar.html({...o,size:28})}${LoAvatar.html({...o,size:64,form:'kreis'})}${LoAvatar.html({...o,size:28,form:'kreis'})}</div>${l}</div>`;
z.innerHTML=Object.entries(namen).map(([c,[n,nr]])=>k(c+' · '+nr,{name:n,nr,logo:'logos/'+c+'.png'})).join('');
h.innerHTML=Object.entries(namen).slice(0,8).map(([c,[n]])=>k(n,{name:n,logo:'logos/'+c+'.png'})).join('')+k('Eigene Farben',{name:'Test Spieler',nr:11,primary:'#7C3AED',secondary:'#FDE68A'})+k('Unbekannter Verein',{name:'Max Muster',nr:5,logo:'logos/xyz.png'});
</script></body></html>
