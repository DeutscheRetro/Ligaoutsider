<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chefred – Ligaoutsider</title>
  <link rel="icon" href="favicon.png" type="image/png"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,sans-serif;background:#0d0d0d;color:#e0e0e0;font-size:14px}
    a{color:#e8c000;text-decoration:none}
    .wrap{max-width:960px;margin:0 auto;padding:24px 16px}
    h1{color:#e8c000;font-size:22px;margin-bottom:4px}
    .sub{color:#555;font-size:12px;margin-bottom:20px}

    /* Login */
    .login{max-width:400px;margin:80px auto;background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:32px}
    .login h2{color:#e8c000;margin-bottom:20px}
    .field{margin-bottom:14px}
    label{display:block;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
    input[type=text],input[type=password],textarea,select{width:100%;background:#111;border:1px solid #2a2a2a;border-radius:5px;color:#ddd;padding:8px 12px;font-size:13px}
    input:focus,textarea:focus{outline:none;border-color:#e8c000}
    .btn{padding:8px 18px;border:none;border-radius:5px;cursor:pointer;font-weight:700;font-size:13px}
    .btn-gold{background:#e8c000;color:#000}
    .btn-red{background:#c62828;color:#fff}
    .btn-green{background:#2e7d32;color:#fff}
    .btn-gray{background:#333;color:#ccc}
    .btn-sm{padding:4px 10px;font-size:11px}
    .btn:hover{opacity:.85}
    .err{background:#b71c1c;color:#fff;padding:8px 12px;border-radius:5px;font-size:13px;margin-bottom:12px}
    .ok{background:#1b5e20;color:#fff;padding:8px 12px;border-radius:5px;font-size:13px;margin-bottom:12px}

    /* Tabs */
    .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid #222;padding-bottom:0}
    .tab{background:none;border:none;color:#888;font-size:13px;font-weight:700;padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
    .tab:hover{color:#ccc}
    .tab.active{color:#e8c000;border-bottom-color:#e8c000}

    /* Artikel-Liste */
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .artikel-card{background:#161616;border:1px solid #222;border-radius:6px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
    .artikel-card img{width:36px;height:36px;object-fit:contain;flex-shrink:0}
    .artikel-card-body{flex:1;min-width:0}
    .artikel-card-titel{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .artikel-card-meta{font-size:11px;color:#555;margin-top:3px}
    .artikel-card-actions{display:flex;gap:8px;flex-shrink:0}

    /* Editor */
    .editor{background:#161616;border:1px solid #222;border-radius:8px;padding:24px}
    .editor h2{color:#e8c000;margin-bottom:20px;font-size:16px}
    textarea{min-height:180px;resize:vertical;font-family:inherit;line-height:1.6;margin-top:0}
    .logo-preview{width:48px;height:48px;object-fit:contain;margin-top:8px}
    .actions-row{display:flex;gap:10px;margin-top:20px}
    .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:#e8c000;color:#000}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid #333;border-top-color:#e8c000;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Stats */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
    .stat-card{background:#161616;border:1px solid #222;border-radius:8px;padding:20px;text-align:center}
    .stat-card .num{font-size:36px;font-weight:900;color:#e8c000}
    .stat-card .lbl{font-size:11px;color:#555;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
    .section-title{font-size:13px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin:24px 0 12px}
    .bar-chart{display:flex;flex-direction:column;gap:6px}
    .bar-row{display:flex;align-items:center;gap:10px;font-size:12px}
    .bar-label{width:120px;text-align:right;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
    .bar-label-date{width:60px;text-align:right;color:#888;flex-shrink:0}
    .bar-wrap{flex:1;background:#1a1a1a;border-radius:3px;height:18px;position:relative}
    .bar-fill{height:100%;border-radius:3px;background:#e8c000;transition:width .4s}
    .bar-val{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#000}
    .bar-val-out{margin-left:6px;font-size:11px;color:#555}

    /* Moderation */
    .user-table{width:100%;border-collapse:collapse}
    .user-table th{text-align:left;font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:1px solid #222}
    .user-table td{padding:10px 12px;border-bottom:1px solid #1a1a1a;font-size:13px;vertical-align:middle}
    .user-table tr:hover td{background:#161616}
    .banned-row td{opacity:.4}
    .banned-badge{display:inline-block;font-size:10px;background:#c62828;color:#fff;padding:2px 6px;border-radius:3px;font-weight:700;margin-left:6px}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="page-login" class="login">
  <h2>⚽ Chefred</h2>
  <div id="login-err" style="display:none" class="err"></div>
  <p style="font-size:12px;color:#888;margin-bottom:14px">Anmeldung über dein Ligaoutsider-Konto. Es braucht die Rolle <b>admin</b> oder <b>moderator</b>.</p>
  <button class="btn btn-gold" style="margin-bottom:16px" onclick="netlifyIdentity.open('login')">Mit Konto anmelden</button>
  <div class="field"><label>GitHub Token (einmalig)</label><input type="text" id="gh-token" placeholder="ghp_..."/><p style="font-size:11px;color:#555;margin-top:4px">Wird nur in diesem Browser gespeichert</p></div>
  <div class="field"><label>Netlify Token (einmalig, für User-Stats)</label><input type="text" id="netlify-token" placeholder="nfp_..."/></div>
  <button class="btn btn-gold" onclick="login()">Einloggen</button>
</div>

<!-- HAUPTSEITE -->
<div id="page-main" style="display:none" class="wrap">
  <h1>⚽ Chefred</h1>
  <p class="sub">Ligaoutsider Redaktions-Panel · <a href="#" onclick="logout()">Abmelden</a></p>

  <div id="msg" style="display:none;margin-bottom:16px"></div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="tab-btn-artikel" onclick="zeigeTab('artikel')">📰 Artikel</button>
    <button class="tab" id="tab-btn-stats" onclick="zeigeTab('stats')">📊 Stats</button>
    <button class="tab" id="tab-btn-kommentare" onclick="zeigeTab('kommentare')">💬 Kommentare</button>
    <button class="tab" id="tab-btn-moderation" onclick="zeigeTab('moderation')">🛡 Moderation</button>
  </div>

  <!-- TAB: ARTIKEL -->
  <div id="tab-artikel">
    <div id="view-list">
      <div class="toolbar">
        <strong id="artikel-count"></strong>
        <button class="btn btn-gray" onclick="ladeArtikel()">↻ Aktualisieren</button>
      </div>
      <div id="artikel-liste"><p style="color:#555">Lade…</p></div>
    </div>

    <div id="view-editor" style="display:none">
      <button class="btn btn-gray" onclick="zeigeListe()" style="margin-bottom:16px">← Zurück</button>
      <div class="editor">
        <h2 id="editor-titel-h">Artikel bearbeiten</h2>
        <input type="hidden" id="edit-id"/>
        <input type="hidden" id="edit-pfad"/>

        <div class="field" style="margin-bottom:14px">
          <label>Titel</label>
          <input type="text" id="edit-titel"/>
        </div>

        <div class="field" style="margin-bottom:14px">
          <label>Vereinslogo</label>
          <select id="edit-logo" onchange="updateLogoPreview()">
            <option value="logos/bayern.png">FC Bayern München</option>
            <option value="logos/leipzig.png">RB Leipzig</option>
            <option value="logos/leverkusen.png">Bayer 04 Leverkusen</option>
            <option value="logos/frankfurt.png">Eintracht Frankfurt</option>
            <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Borussia_Dortmund_logo.svg/60px-Borussia_Dortmund_logo.svg.png">Borussia Dortmund</option>
            <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/VfB_Stuttgart_1893_Logo.svg/60px-VfB_Stuttgart_1893_Logo.svg.png">VfB Stuttgart</option>
            <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Logo_TSG_Hoffenheim.svg/60px-Logo_TSG_Hoffenheim.svg.png">TSG Hoffenheim</option>
            <option value="https://upload.wikimedia.org/wikipedia/de/thumb/b/bf/SC_Freiburg_Logo.svg/60px-SC_Freiburg_Logo.svg.png">SC Freiburg</option>
            <option value="https://upload.wikimedia.org/wikipedia/de/thumb/b/b5/Logo_FC_Augsburg.svg/60px-Logo_FC_Augsburg.svg.png">FC Augsburg</option>
            <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Logo_Mainz_05.svg/60px-Logo_Mainz_05.svg.png">1. FSV Mainz 05</option>

            <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/SV-Werder-Bremen-Logo.svg/60px-SV-Werder-Bremen-Logo.svg.png">SV Werder Bremen</option>
            <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/FC_Schalke_04_Logo.svg/60px-FC_Schalke_04_Logo.svg.png">FC Schalke 04</option>
            <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/SC_Paderborn_07_Logo_new.svg/60px-SC_Paderborn_07_Logo_new.svg.png">SC Paderborn 07</option>
            <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/SV_Elversberg_Logo_2021.svg/60px-SV_Elversberg_Logo_2021.svg.png">SV Elversberg</option>
            <option value="https://upload.wikimedia.org/wikipedia/en/thumb/d/df/Bundesliga_logo_%282017%29.svg/120px-Bundesliga_logo_%282017%29.svg.png">Bundesliga (allgemein)</option>
          </select>
          <img id="logo-preview" class="logo-preview" src="" alt=""/>
        </div>

        <div class="field" style="margin-bottom:14px">
          <label>Text (Absätze mit Leerzeile trennen)</label>
          <textarea id="edit-text" rows="10"></textarea>
        </div>

        <div class="actions-row">
          <button class="btn btn-green" onclick="speichern()">💾 Speichern &amp; deployen</button>
          <button class="btn btn-red" onclick="loeschen()">🗑 Artikel löschen</button>

      </div>
    </div>
  </div>

  <!-- TAB: STATS -->
  <div id="tab-stats" style="display:none">
    <div id="stats-inhalt"><p style="color:#555"><span class="spinner"></span>Lade Stats…</p></div>
  </div>

  <!-- TAB: MODERATION -->
  <div id="tab-kommentare" style="display:none">
    <div id="komm-msg" style="display:none;margin-bottom:16px"></div>
    <div class="toolbar">
      <input type="text" id="komm-suche" placeholder="Nach Text, Name oder E-Mail suchen…" style="max-width:320px" oninput="renderKommentare()"/>
      <div style="display:flex;gap:8px;align-items:center">
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;color:#888;margin:0">
          <input type="checkbox" id="komm-geloeschte" style="width:auto" onchange="renderKommentare()"/> gelöschte zeigen
        </label>

    <div class="toolbar" style="margin-bottom:10px">
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;color:#ccc;margin:0">
        <input type="checkbox" id="komm-alle" style="width:auto" onchange="alleWaehlen(this.checked)"/> Alle auswählen
      </label>
      <div style="display:flex;gap:8px">
        <span id="komm-gewaehlt" style="font-size:12px;color:#888;align-self:center"></span>
        <button class="btn btn-gray btn-sm" onclick="auswahlLoeschen(false)">Ausgewählte ausblenden</button>
        <button class="btn btn-red btn-sm" onclick="auswahlLoeschen(true)">Endgültig löschen</button>

  <div id="tab-moderation" style="display:none">
    <div id="mod-msg" style="display:none;margin-bottom:16px"></div>
    <div class="toolbar">
      <input type="text" id="mod-suche" placeholder="Nach Name oder E-Mail suchen…" style="max-width:320px" oninput="renderNutzer()"/>
      <button class="btn btn-gray" onclick="ladeModerationsdaten()">↻ Aktualisieren</button>
    </div>
    <div id="mod-inhalt"><p style="color:#555"><span class="spinner"></span>Lade Nutzer…</p></div>

<script>
const REPO     = 'DeutscheRetro/Ligaoutsider';

// Schreibzugriffe auf die Datenbank laufen serverseitig; der anon-Key liest nur.
async function loApi(aktion, daten = {}) {
  const user = window.netlifyIdentity && netlifyIdentity.currentUser();
  if (!user) throw new Error('Nicht angemeldet');
  const token = await user.jwt();
  const res = await fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify({ aktion, ...daten })
  });
  const antwort = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(antwort.fehler || `Fehler ${res.status}`);
  return antwort;
}
const SUPABASE_URL  = 'https://rsodjlglzwlscamdlwev.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzb2RqbGdsendsc2NhbWRsd2V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNjk1MzIsImV4cCI6MjA5Njk0NTUzMn0.ETR6sL-b-ZmjuqWFmj3jgP2vzq70J0Yb4JgATOCekns';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const NETLIFY_SITE_ID     = 'cb939f1a-0538-4e1d-ad3d-9ca81bed209a';
const NETLIFY_IDENTITY_ID = '6a467b53e81902b5ccd77424';

let ghToken      = '';
let netlifyToken = '';
let feedDaten    = [];
let feedSha      = '';
let netlifyUsers = [];

// ─── Auth ────────────────────────────────────────────────────────────────────
// Ohne init() stellt das Widget die Sitzung beim Laden nicht wieder her;
// currentUser() bliebe null und jeder Serveraufruf scheiterte mit
// "Nicht angemeldet", obwohl man angemeldet ist.
if (window.netlifyIdentity) {
  netlifyIdentity.on('login', () => { netlifyIdentity.close(); login(); });
  netlifyIdentity.on('logout', () => { sessionStorage.removeItem('auth'); location.reload(); });
  netlifyIdentity.init();
}

async function login() {
  const tok = document.getElementById('gh-token').value.trim();
  const ntok = document.getElementById('netlify-token').value.trim();
  const user = window.netlifyIdentity && netlifyIdentity.currentUser();
  if (!user) { zeigeFehler('login-err', 'Bitte zuerst mit deinem Konto anmelden'); return; }
  // Rechte vom Server bestaetigen lassen; Rollen stehen in der Datenbank
  try {
    const wer = await loApi('wer_bin_ich');
    if (!wer.darfLoeschen) {
      zeigeFehler('login-err', 'Dieses Konto hat keine Redaktionsrechte');
      return;
    }
  } catch (e) {
    zeigeFehler('login-err', 'Rechte konnten nicht geprüft werden: ' + e.message);
    return;
  }
  if (tok)  localStorage.setItem('gh_token', tok);
  if (ntok) localStorage.setItem('netlify_token', ntok);
  ghToken      = localStorage.getItem('gh_token') || '';
  netlifyToken = localStorage.getItem('netlify_token') || '';
  if (!ghToken) { zeigeFehler('login-err', 'GitHub Token fehlt'); return; }
  sessionStorage.setItem('auth', '1');
  document.getElementById('page-login').style.display = 'none';
  document.getElementById('page-main').style.display = 'block';
  init();
}

function logout() { sessionStorage.removeItem('auth'); location.reload(); }

function zeigeFehler(id, txt) {
  const el = document.getElementById(id);
  el.textContent = txt; el.style.display = 'block';
}

// ─── GitHub API ───────────────────────────────────────────────────────────────
async function ghGet(path) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    headers: { Authorization: `token ${ghToken}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (!r.ok) throw new Error(`GitHub API ${r.status}: ${await r.text()}`);
  return r.json();
}

async function ghPut(path, content, sha, message) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `token ${ghToken}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha })
  });
  if (!r.ok) throw new Error(`GitHub API ${r.status}: ${await r.text()}`);
  return r.json();
}

async function ghDelete(path, sha, message) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'DELETE',
    headers: { Authorization: `token ${ghToken}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, sha })
  });
  if (!r.ok) throw new Error(`GitHub API ${r.status}: ${await r.text()}`);
}

// ─── Netlify Identity API ─────────────────────────────────────────────────────
async function ladeNetlifyUsers() {
  if (!netlifyToken) return;
  try {
    const r = await fetch(
      `https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/identity/${NETLIFY_IDENTITY_ID}/users?per_page=1000`,
      { headers: { Authorization: `Bearer ${netlifyToken}` } }
    );
    if (r.ok) netlifyUsers = await r.json();
  } catch(e) { /* optional */ }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([ladeArtikel(), ladeNetlifyUsers()]);
}

// ─── Tab-Navigation ───────────────────────────────────────────────────────────
function zeigeTab(name) {
  ['artikel','stats','kommentare','moderation'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === name ? 'block' : 'none';
    document.getElementById('tab-btn-' + t).classList.toggle('active', t === name);
  });
  if (name === 'stats') {
    // Die Sperrzahl stammt aus der Nutzerliste; beim ersten Aufruf fehlt sie noch
    if (!nutzerListe.length) ladeModerationsdaten().then(renderStats);
    else renderStats();
  }
  if (name === 'kommentare') ladeKommentarListe();
  if (name === 'moderation') ladeModerationsdaten();
}

// ─── Artikel laden ────────────────────────────────────────────────────────────
async function ladeArtikel() {
  const liste = document.getElementById('artikel-liste');
  liste.innerHTML = '<p style="color:#555"><span class="spinner"></span>Lade feed.json…</p>';
  try {
    const data = await ghGet('feed.json');
    feedSha   = data.sha;
    feedDaten = JSON.parse(decodeURIComponent(escape(atob(data.content))));
    document.getElementById('artikel-count').textContent = feedDaten.length + ' Artikel';
    renderListe();
  } catch(e) {
    liste.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

function renderListe() {
  const liste = document.getElementById('artikel-liste');
  if (!feedDaten.length) { liste.innerHTML = '<p style="color:#555">Keine Artikel</p>'; return; }
  liste.innerHTML = feedDaten.map((a, i) => `
    <div class="artikel-card">
      <img src="${a.wappen_url || ''}" onerror="this.style.display='none'" />
      <div class="artikel-card-body">
        <div class="artikel-card-titel">${a.titel}</div>
        <div class="artikel-card-meta">${a.datum} · <span class="badge" style="background:${a.badge_bg};color:${a.badge_fg}">${a.badge}</span></div>
      </div>
      <div class="artikel-card-actions">
        <button class="btn btn-gold" onclick="bearbeiten(${i})">Bearbeiten</button>
        <button class="btn btn-red" onclick="schnellLoeschen(${i})">✕</button>
      </div>
    </div>
  `).join('');
}

// ─── Editor ───────────────────────────────────────────────────────────────────
async function bearbeiten(idx) {
  const a = feedDaten[idx];
  document.getElementById('edit-id').value   = a.id;
  document.getElementById('edit-pfad').value = idx;
  document.getElementById('edit-titel').value = a.titel;
  document.getElementById('editor-titel-h').textContent = 'Bearbeiten: ' + a.titel.substring(0,50);

  const sel = document.getElementById('edit-logo');
  let gefunden = false;
  for (let opt of sel.options) {
    if (opt.value === a.wappen_url) { opt.selected = true; gefunden = true; break; }
  }
  if (!gefunden && a.wappen_url) {
    const opt = new Option(a.wappen_url, a.wappen_url, true, true);
    sel.add(opt);
  }
  updateLogoPreview();

  document.getElementById('edit-text').value = 'Lade…';
  try {
    const htmlData = await ghGet(a.pfad);
    const html = decodeURIComponent(escape(atob(htmlData.content)));
    const match = html.match(/<div class="artikel-text">([\s\S]*?)<\/div>/);
    if (match) {
      const text = match[1].replace(/<p>([\s\S]*?)<\/p>/g, '$1\n\n').replace(/<[^>]+>/g,'').trim();
      document.getElementById('edit-text').value = text;
    }
  } catch(e) {
    document.getElementById('edit-text').value = '(Text konnte nicht geladen werden)';
  }
  zeigeEditor();
}

  document.getElementById('logo-preview').src = document.getElementById('edit-logo').value;

// ─── Speichern ────────────────────────────────────────────────────────────────
async function speichern() {
  const idx        = parseInt(document.getElementById('edit-pfad').value);
  const neuerTitel = document.getElementById('edit-titel').value.trim();
  const neuesLogo  = document.getElementById('edit-logo').value;
  const neuerText  = document.getElementById('edit-text').value.trim();

  zeigeMsg('<span class="spinner"></span>Speichere…', false);
  try {
    const a = feedDaten[idx];
    const htmlData = await ghGet(a.pfad);
    let html = decodeURIComponent(escape(atob(htmlData.content)));
    html = html.replace(/<h1 class="artikel-titel">.*?<\/h1>/, `<h1 class="artikel-titel">${neuerTitel}</h1>`);
    const absaetze = neuerText.split('\n\n').filter(p=>p.trim()).map(p=>`<p>${p.trim()}</p>`).join('');
    html = html.replace(/<div class="artikel-text">[\s\S]*?<\/div>/, `<div class="artikel-text">${absaetze}</div>`);
    if (neuesLogo) html = html.replace(/src="[^"]*" class="artikel-wappen"/, `src="${neuesLogo}" class="artikel-wappen"`);
    await ghPut(a.pfad, html, htmlData.sha, `✏️ Artikel bearbeitet: ${neuerTitel.substring(0,50)}`);

    feedDaten[idx].titel      = neuerTitel;
    feedDaten[idx].wappen_url = neuesLogo;
    const feedData = await ghGet('feed.json');
    await ghPut('feed.json', JSON.stringify(feedDaten, null, 2), feedData.sha, `📝 feed.json: ${neuerTitel.substring(0,50)}`);

    zeigeMsg('✓ Gespeichert! Netlify deployed in ~1 Minute.', true);
    renderListe();
  } catch(e) {
    zeigeMsg('Fehler: ' + e.message, false);
  }
}

// ─── Löschen ──────────────────────────────────────────────────────────────────
async function loeschen() {
  if (!confirm('Artikel wirklich löschen?')) return;
  const idx = parseInt(document.getElementById('edit-pfad').value);
  await doLoeschen(idx);
  zeigeListe();
}

async function schnellLoeschen(idx) {
  if (!confirm('Artikel wirklich löschen?')) return;
  await doLoeschen(idx);
}

async function doLoeschen(idx) {
  const a = feedDaten[idx];
  zeigeMsg('<span class="spinner"></span>Lösche…', false);
  try {
    // Sofort ausblenden: die Seite filtert dagegen, bis der Build durch ist
    try { await loApi('artikel_ausblenden', { artikel_id: a.id }); }
    catch (e) { console.warn('Sofort-Ausblenden fehlgeschlagen:', e.message); }

    // HTML löschen (404 = schon weg, ignorieren)
    try {
      const htmlData = await ghGet(a.pfad);
      await ghDelete(a.pfad, htmlData.sha, `🗑 Artikel gelöscht: ${a.titel.substring(0,50)}`);
    } catch(e) {
      if (!e.message.includes('404')) throw e;
    }

    // feed.json mit Retry bei 409 (Bot könnte zeitgleich committen)
    let versuche = 0;
    while (versuche < 4) {
      versuche++;
      const feedData = await ghGet('feed.json');
      const aktuellFeed = JSON.parse(decodeURIComponent(escape(atob(feedData.content))));
      const gefiltertesFeed = aktuellFeed.filter(x => x.id !== a.id);
      try {
        await ghPut('feed.json', JSON.stringify(gefiltertesFeed, null, 2), feedData.sha, `🗑 feed.json: ${a.titel.substring(0,50)}`);
        feedDaten = gefiltertesFeed;
        break; // Erfolg
      } catch(e) {
        if (e.message.includes('409') && versuche < 4) {
          await new Promise(r => setTimeout(r, 800 * versuche)); // kurz warten, dann nochmal
          continue;
        }
        throw e;
      }
    }

    // ID dauerhaft in deleted_ids.json blockieren (Retry bei 409)
    for (let v = 0; v < 3; v++) {
      try {
        const delData = await ghGet('deleted_ids.json');
        const delIds = JSON.parse(decodeURIComponent(escape(atob(delData.content))));
        if (!delIds.includes(a.id)) {
          delIds.push(a.id);
          await ghPut('deleted_ids.json', JSON.stringify(delIds, null, 2), delData.sha, `🚫 deleted_ids: ${a.id}`);
        }
        break;
      } catch(e) {
        if (e.message.includes('409') && v < 2) { await new Promise(r => setTimeout(r, 600)); continue; }
      }
    }

    zeigeMsg('✓ Gelöscht!', true);
    renderListe();
  } catch(e) {
    zeigeMsg('Fehler: ' + e.message, false);
  }
}

function zeigeMsg(txt, ok) {
  const el = document.getElementById('msg');
  el.className = ok ? 'ok' : 'err';
  el.innerHTML = txt;
  el.style.display = 'block';
  if (ok) setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function renderStats() {
  if (!feedDaten.length) {
    document.getElementById('stats-inhalt').innerHTML = '<p style="color:#555">Keine Daten geladen.</p>';
    return;
  }

  const heute = new Date();
  const vor30 = new Date(heute); vor30.setDate(heute.getDate() - 29);

  // Artikel pro Tag (letzte 30 Tage)
  const proTag = {};
  for (let i = 29; i >= 0; i--) {
    const d = new Date(heute); d.setDate(heute.getDate() - i);
    proTag[d.toISOString().slice(0,10)] = 0;
  }
  feedDaten.forEach(a => {
    const key = a.datum ? a.datum.slice(0,10) : null;
    if (key && proTag[key] !== undefined) proTag[key]++;
  });

  // Top-Quellen (badge)
  const quellen = {};
  feedDaten.forEach(a => {
    const q = a.badge || 'Unbekannt';
    quellen[q] = (quellen[q] || 0) + 1;
  });
  const topQuellen = Object.entries(quellen).sort((a,b) => b[1]-a[1]).slice(0,10);

  // Heute
  const tagesKey = heute.toISOString().slice(0,10);
  const heute_count = proTag[tagesKey] || 0;

  // Max für Balken
  const maxTag = Math.max(...Object.values(proTag), 1);
  const maxQ   = topQuellen[0]?.[1] || 1;

  // Letzten 14 Tage für Balken (lesbar)
  const letzte14 = Object.entries(proTag).slice(-14);

  // User-Stats aus Netlify
  const totalUser     = netlifyUsers.length;
  const confirmedUser = netlifyUsers.filter(u => u.confirmed_at).length;
  const heute7d = new Date(heute); heute7d.setDate(heute.getDate() - 7);
  const neueUser7d = netlifyUsers.filter(u => u.created_at && new Date(u.created_at) > heute7d).length;

  document.getElementById('stats-inhalt').innerHTML = `
    <div class="section-title">Nutzer (Netlify Identity)</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="num">${totalUser}</div><div class="lbl">Registriert gesamt</div></div>
      <div class="stat-card"><div class="num">${confirmedUser}</div><div class="lbl">Bestätigt</div></div>
      <div class="stat-card"><div class="num">${neueUser7d}</div><div class="lbl">Neu (7 Tage)</div></div>
      <div class="stat-card"><div class="num">${nutzerListe.filter(u => u.gebannt).length}</div><div class="lbl">Gebannt</div></div>
    </div>

    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>Seitenaufrufe</span>
      <a href="https://analytics.google.com/" target="_blank" class="btn btn-gray btn-sm">📊 Google Analytics öffnen ↗</a>
    </div>
    <p style="color:#555;font-size:12px;margin-bottom:24px">Echtzeit-Daten, Seitenaufrufe, Nutzerherkunft → direkt in GA4 verfügbar (Property G-SP8DWFL2SE).</p>

    <div class="section-title">Artikel</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="num">${feedDaten.length}</div><div class="lbl">Artikel gesamt</div></div>
      <div class="stat-card"><div class="num">${heute_count}</div><div class="lbl">Heute</div></div>
      <div class="stat-card"><div class="num">${Object.keys(quellen).length}</div><div class="lbl">Verschiedene Quellen</div></div>
      <div class="stat-card"><div class="num">${Math.round(feedDaten.length / 30)}</div><div class="lbl">Ø Artikel/Tag (30d)</div></div>
    </div>

    <div class="section-title">Artikel letzte 14 Tage</div>
    <div class="bar-chart">
      ${letzte14.map(([tag, n]) => {
        const w = Math.round((n / maxTag) * 100);
        const label = tag.slice(5); // MM-DD
        return `<div class="bar-row">
          <span class="bar-label-date">${label}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${w}%">${n > 0 ? `<span class="bar-val">${n}</span>` : ''}</div></div>
          ${n === 0 ? '<span class="bar-val-out">0</span>' : ''}
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Top-Quellen</div>
    <div class="bar-chart">
      ${topQuellen.map(([quelle, n]) => {
        const w = Math.round((n / maxQ) * 100);
        return `<div class="bar-row">
          <span class="bar-label">${quelle}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${w}%">${n > 3 ? `<span class="bar-val">${n}</span>` : ''}</div></div>
          ${n <= 3 ? `<span class="bar-val-out">${n}</span>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

let kommentarListe = [];

function kommEscape(t) {
  return String(t ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function ladeKommentarListe() {
  const el = document.getElementById('komm-inhalt');
  el.innerHTML = '<p style="color:#555"><span class="spinner"></span>Lade Kommentare…</p>';
  try {
    const r = await loApi('kommentar_liste');
    kommentarListe = r.kommentare || [];
    renderKommentare();
  } catch(e) {
    el.innerHTML = `<div class="err">${kommEscape(e.message)}</div>`;
  }
}

function titelZuArtikel(aid) {
  const a = (feedDaten || []).find(x => x.id === aid);
  return a ? a.titel : aid;
}

function gefilterteKommentare() {
  const q = (document.getElementById('komm-suche')?.value || '').trim().toLowerCase();
  const mitGeloeschten = document.getElementById('komm-geloeschte')?.checked;
  return kommentarListe.filter(k => {
    if (!mitGeloeschten && k.geloescht) return false;
    if (!q) return true;
    return (k.inhalt || '').toLowerCase().includes(q)
        || (k.name || '').toLowerCase().includes(q)
        || (k.email || '').toLowerCase().includes(q)
        || titelZuArtikel(k.artikel_id).toLowerCase().includes(q);
  });
}

function renderKommentare() {
  const el = document.getElementById('komm-inhalt');
  const liste = gefilterteKommentare();

  if (!kommentarListe.length) {
    el.innerHTML = '<p style="color:#555">Noch keine Kommentare.</p>';
    zaehleAuswahl();
    return;
  }
  if (!liste.length) {
    el.innerHTML = '<p style="color:#555">Kein Treffer.</p>';
    zaehleAuswahl();
    return;
  }

  el.innerHTML = `
    <p style="color:#555;font-size:12px;margin-bottom:10px">${liste.length} von ${kommentarListe.length} Kommentaren</p>
    <table class="user-table">
      <thead>
        <tr>
          <th style="width:28px"></th>
          <th>Kommentar</th><th>Von</th><th>Artikel</th><th>Datum</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${liste.map(k => {
          const datum = k.erstellt_am
            ? new Date(k.erstellt_am).toLocaleDateString('de-DE') + ' ' +
              new Date(k.erstellt_am).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' })
            : '–';
          const text = k.geloescht
            ? '<i style="color:#555">— gelöscht —</i>'
            : kommEscape((k.inhalt || '').slice(0, 140)) + ((k.inhalt || '').length > 140 ? '…' : '');
          const artikel = kommEscape(titelZuArtikel(k.artikel_id).slice(0, 44));
          return `<tr class="${k.geloescht ? 'banned-row' : ''}">
            <td><input type="checkbox" class="komm-box" value="${k.id}" style="width:auto" onchange="zaehleAuswahl()"/></td>
            <td style="max-width:360px">${text}</td>
            <td style="font-size:12px">${kommEscape(k.name || '–')}<br><span style="color:#555;font-size:11px">${kommEscape(k.email || '')}</span></td>
            <td style="font-size:12px;color:#888">${artikel}</td>
            <td style="color:#555;font-size:12px;white-space:nowrap">${datum}</td>
            <td><button class="btn btn-red btn-sm" onclick="einzelnLoeschen('${k.id}')">Löschen</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  document.getElementById('komm-alle').checked = false;
  zaehleAuswahl();
}

function alleWaehlen(an) {
  document.querySelectorAll('.komm-box').forEach(b => { b.checked = an; });
  zaehleAuswahl();
}

function gewaehlteIds() {
  return [...document.querySelectorAll('.komm-box')].filter(b => b.checked).map(b => b.value);
}

function zaehleAuswahl() {
  const n = gewaehlteIds().length;
  const el = document.getElementById('komm-gewaehlt');
  if (el) el.textContent = n ? `${n} ausgewählt` : '';
}

function zeigeMsgKomm(txt, ok) {
  const el = document.getElementById('komm-msg');
  el.className = ok ? 'ok' : 'err';
  el.innerHTML = txt;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);

async function auswahlLoeschen(hart) {
  const ids = gewaehlteIds();
  if (!ids.length) { zeigeMsgKomm('Nichts ausgewählt.', false); return; }
  const was = hart
    ? `${ids.length} Kommentar(e) ENDGÜLTIG löschen?\n\nDas lässt sich nicht rückgängig machen.`
    : `${ids.length} Kommentar(e) ausblenden?\n\nSie erscheinen als „gelöscht", der Eintrag bleibt erhalten.`;
  if (!confirm(was)) return;
  zeigeMsgKomm('<span class="spinner"></span>Lösche…', false);
  try {
    const r = await loApi('kommentare_loeschen', { ids, hart: !!hart });
    zeigeMsgKomm(`✓ ${r.anzahl} Kommentar(e) ${hart ? 'gelöscht' : 'ausgeblendet'}.`, true);
    ladeKommentarListe();
  } catch(e) {
    zeigeMsgKomm('Fehler: ' + kommEscape(e.message), false);
  }
}

async function einzelnLoeschen(id) {
  if (!confirm('Diesen Kommentar endgültig löschen?')) return;
  try {
    await loApi('kommentare_loeschen', { ids: [id], hart: true });
    zeigeMsgKomm('✓ Kommentar gelöscht.', true);
    ladeKommentarListe();
  } catch(e) {
    zeigeMsgKomm('Fehler: ' + kommEscape(e.message), false);
  }
}

async function kontoLoeschen(email, kontoId) {
  if (!confirm(`Konto ${email} endgültig löschen?\n\nAlle Kommentare, Forenbeiträge und Rollen werden mitgelöscht. Das lässt sich nicht rückgängig machen.`)) return;
  if (!confirm(`Wirklich sicher? ${email} wird unwiderruflich entfernt.`)) return;
  zeigeMsgMod('<span class="spinner"></span>Lösche Konto…', false);
  try {
    await loApi('konto_loeschen', { email, konto_id: kontoId });
    zeigeMsgMod(`✓ Konto ${email} gelöscht.`, true);
    ladeModerationsdaten();
  } catch(e) {
    zeigeMsgMod('Fehler: ' + e.message, false);
  }
}

async function banne(email) {
  if (!confirm(`${email} sperren?\n\nAlle Kommentare und Forenbeiträge werden gelöscht.`)) return;
  zeigeMsgMod('<span class="spinner"></span>Sperre…', false);
  try {
    await loApi('user_purge', { email });
    await loApi('ban', { email });
    zeigeMsgMod(`✓ ${email} gesperrt, Beiträge gelöscht.`, true);
    ladeModerationsdaten();
  } catch(e) {
    zeigeMsgMod('Fehler: ' + e.message, false);
  }
}

async function entbanne(email) {
  if (!confirm(`${email} entsperren?`)) return;
  zeigeMsgMod('<span class="spinner"></span>Entsperre…', false);
  try {
    await loApi('unban', { email });
    zeigeMsgMod(`✓ ${email} entsperrt.`, true);
    ladeModerationsdaten();
  } catch(e) {
    zeigeMsgMod('Fehler: ' + e.message, false);
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// Die Hauptseite erst zeigen, wenn wirklich eine Anmeldung vorliegt. Frueher
// genuegte ein Merker in der Sitzungsablage - dann stand das Panel offen,
// obwohl jeder Serveraufruf mit "Nicht angemeldet" scheiterte.
function seiteOeffnenWennAngemeldet() {
  const user = window.netlifyIdentity && netlifyIdentity.currentUser();
  if (!user || sessionStorage.getItem('auth') !== '1') return;
  ghToken      = localStorage.getItem('gh_token') || '';
  netlifyToken = localStorage.getItem('netlify_token') || '';
  document.getElementById('page-login').style.display = 'none';
  document.getElementById('page-main').style.display = 'block';
  init();
}
if (window.netlifyIdentity) netlifyIdentity.on('init', seiteOeffnenWennAngemeldet);
</script>
