    .cs-liste li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text2); }

  <script>
  (function () {
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const VEREINE = { bayern: ['FC Bayern München', 'Bayern'], dortmund: ['Borussia Dortmund', 'Dortmund'], leipzig: ['RB Leipzig', 'Leipzig'],
      leverkusen: ['Bayer 04 Leverkusen', 'Leverkusen'], frankfurt: ['Eintracht Frankfurt', 'Frankfurt'], stuttgart: ['VfB Stuttgart', 'Stuttgart'],
      gladbach: ['Borussia Mönchengladbach', 'Gladbach'], freiburg: ['SC Freiburg', 'Freiburg'], union: ['1. FC Union Berlin', 'Union'],
      mainz: ['1. FSV Mainz 05', 'Mainz'], augsburg: ['FC Augsburg', 'Augsburg'], werder: ['SV Werder Bremen', 'Werder'],
      hoffenheim: ['TSG Hoffenheim', 'Hoffenheim'], hsv: ['Hamburger SV', 'Hamburger'], koeln: ['1. FC Köln', 'Köln'],
      schalke: ['FC Schalke 04', 'Schalke'], paderborn: ['SC Paderborn 07', 'Paderborn'], elversberg: ['SV Elversberg', 'Elversberg'] };
    const box = document.getElementById('mb-inhalt'), sub = document.getElementById('mb-sub');
    let feed = [], news = {}, kurz = {}, kb = {}, auf = {}, daten = { verein: '', favoriten: [] }, tipp = { tipps: {}, punkte: 0 }, rang = { rangliste: [], aktueller_spieltag: 1 }, spieltagSpiele = [];
    const LOGO_TEAM = n => { const l = String(n).toLowerCase(); return Object.entries(VEREINE).find(([, [, kurz]]) => l.includes(kurz.toLowerCase()))?.[0] || ''; };
    const nk = t => String(t || '').normalize('NFKD').replace(/ø/g, 'o').replace(/ß/g, 'ss').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const mio = n => (n / 1e6).toLocaleString('de-DE', { maximumFractionDigits: n >= 1e7 ? 1 : 2 }) + ' Mio. €';
    const prozent = (d, mw) => mw ? (100 * d / mw) : 0;
    const pf = p => (p > 0 ? '+' : '') + p.toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %';
    // Kickbase-Daten und Aufstellungsstatus je Favorit
    function kbVon(k) {
      const direkt = kb[k.l + '|' + nk(k.n)];
      if (direkt) return direkt;
      const nach = nk(k.n).split(' ').pop();
      const treffer = Object.entries(kb).filter(([s]) => s.startsWith(k.l + '|') && s.split(' ').pop() === nach);
      return treffer.length === 1 ? treffer[0][1] : null;
    }
    function aufVon(k) {
      const n = nk(k.n), nach = n.split(' ').pop();
      for (const t of Object.values(auf.teams || {})) {
        if (!(t.logo || '').endsWith('/' + k.l + '.png')) continue;
        const alle = Object.values(t.elf || {}).flat();
        const x = alle.find(p => nk(p.name) === n) || alle.find(p => nk(p.name).split(' ').pop() === nach);
        if (x) return x;
      }
      return null;
    }
    const AMPEL = { gruen: ['🟢', 'Startelf wahrscheinlich'], gelb: ['🟡', 'Fraglich'], rot: ['🔴', 'Fällt wohl aus'] };
    function auffaellig(i) {
      const k = kurz[i], d = kbVon(k), a = aufVon(k), g = [];
      if (d && Math.abs(prozent(d.d, d.mw)) >= 4) g.push(`Marktwert heute ${pf(prozent(d.d, d.mw))}`);
      if (d && Math.abs(prozent(d.w, d.mw)) >= 8) g.push(`Marktwert 7 Tage ${pf(prozent(d.w, d.mw))}`);
      if (d && d.s) g.push(d.i || 'Angeschlagen');
      if (a && a.ampel === 'rot') g.push('Aufstellung: ' + (a.grund || 'fällt wohl aus'));
      else if (a && a.ampel === 'gelb') g.push('Aufstellung: ' + (a.grund || 'fraglich'));
      return g;
    }

    function gast() {
      sub.textContent = 'Nur mit Konto';
      box.innerHTML = `<section class="mb-box mb-gast"><h2>Dein Bereich für Liga und Manager</h2>
        <ul style="list-style:none;padding:0">
          <li>🏟️ Deinen Verein wählen, seine News zuerst sehen</li>
          <li>⭐ Lieblingsspieler merken, Marktwert und Einsatzchance im Blick</li>
          <li>🎯 Beim Tippspiel Punkte sammeln und in der Rangliste klettern</li>
          <li>☁️ Deine Elf im Konto speichern, auf jedem Gerät</li>
          <li>💬 Kommentieren, bewerten, diskutieren</li></ul>
        <button class="fav-btn" id="mb-reg" style="font-size:15px;padding:10px 20px">Kostenlos registrieren</button>
        <p class="cs-hinweis" style="margin-top:12px">Ein Klick mit Google genügt. Schon ein Konto? <a href="#" id="mb-login" style="color:var(--accent)">Anmelden</a></p></section>`;
      document.getElementById('mb-reg').onclick = () => netlifyIdentity.open('signup');
      document.getElementById('mb-login').onclick = e => { e.preventDefault(); netlifyIdentity.open('login'); };
    }

    function vereinBox() {
      const v = VEREINE[daten.verein];
      const optionen = '<option value="">– Verein wählen –</option>' + Object.entries(VEREINE).map(([k, [n]]) =>
        `<option value="${k}" ${daten.verein === k ? 'selected' : ''}>${esc(n)}</option>`).join('');
      let liste = '';
      if (v) {
        const n = feed.filter(a => (a.vereine || []).includes(v[1])).slice(0, 8);
        liste = `<div class="mb-liste" style="margin-top:12px">${n.map(a => `<a href="${esc(a.pfad)}"><span>${esc(a.titel)}</span><small>${esc((a.datum || '').split(' ')[0])}</small></a>`).join('') || '<p class="cs-leer">Noch keine Meldungen.</p>'}</div>
          <p class="cs-hinweis" style="margin-top:10px"><a href="verein/${daten.verein}.html" style="color:var(--accent)">Verein ansehen</a> ·
          <a href="aufstellung.html?team=${encodeURIComponent(v[0])}" style="color:var(--accent)">Voraussichtliche Elf</a></p>`;
      }
      return `<section class="mb-box"><h2>🏟️ Mein Verein</h2><p class="cs-hinweis">Deine Lieblingsmannschaft. Ihre News stehen hier zuerst.</p>
        <select class="mb-select" id="mb-verein">${optionen}</select>${liste}</section>`;
    }

    function tippBox() {
      const jetzt = Date.now();
      const offen = spieltagSpiele.filter(s => new Date(s.matchDateTimeUTC).getTime() > jetzt && !s.matchIsFinished);
      const fehlend = offen.filter(s => !tipp.tipps[s.matchID]);
      const h = window._loIch && window._loIch.handle;
      const i = h ? rang.rangliste.findIndex(x => x.handle === h) : -1;
      const platz = i >= 0 ? `Platz ${i + 1} von ${rang.rangliste.length}` : (rang.rangliste.length ? 'noch nicht in der Rangliste' : 'Rangliste startet nach den ersten Spielen');
      const naechst = offen.sort((a, b) => new Date(a.matchDateTimeUTC) - new Date(b.matchDateTimeUTC))[0];
      return `<section class="mb-box"><h2>🎯 Tippspiel</h2>
        <div class="cs-zahlen" style="margin-bottom:12px">
          <div class="cs-zahl"><b>${tipp.punkte}</b><span>Punkte</span></div>
          <div class="cs-zahl"><b style="font-size:17px;line-height:1.3;margin-top:6px">${esc(platz)}</b><span>Rangliste</span></div>
          <div class="cs-zahl"><b style="color:${fehlend.length ? '#e53935' : '#4caf50'}">${fehlend.length}</b><span>Offene Tipps, ${rang.aktueller_spieltag}. Spieltag</span></div></div>
        <p class="cs-hinweis" style="margin:0">${naechst ? `Nächster Anpfiff: ${new Date(naechst.matchDateTimeUTC).toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })} Uhr · ` : ''}<a href="tippspiel.html" style="color:var(--accent);font-weight:700">${fehlend.length ? 'Jetzt tippen →' : 'Zum Tippspiel →'}</a></p></section>`;
    }

    function naechstesSpielBox() {
      const v = VEREINE[daten.verein];
      if (!v) return '';
      const key = v[1].toLowerCase();
      const s = spieltagSpiele.find(x => !x.matchIsFinished && (x.team1.teamName.toLowerCase().includes(key) || x.team2.teamName.toLowerCase().includes(key)));
      if (!s) return '';
      const an = new Date(s.matchDateTimeUTC), t = tipp.tipps[s.matchID], live = an.getTime() <= Date.now();
      const lg = n => { const k = LOGO_TEAM(n); return k ? `<img src="logos/${k}.png" alt="" style="width:34px;height:34px;object-fit:contain">` : ''; };
      return `<section class="mb-box"><h2>📅 Nächstes Spiel</h2>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:15px;font-weight:800;color:var(--text)">
          <span style="display:flex;align-items:center;gap:8px">${lg(s.team1.teamName)}${esc(s.team1.shortName || s.team1.teamName)}</span><span style="color:var(--text4)">vs.</span>
          <span style="display:flex;align-items:center;gap:8px">${lg(s.team2.teamName)}${esc(s.team2.shortName || s.team2.teamName)}</span></div>
        <p class="cs-hinweis" style="margin:8px 0 0">${live ? '<strong style="color:#e53935">● LIVE</strong>' : an.toLocaleString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' Uhr'}
          · ${t ? `Dein Tipp <strong>${t.h}:${t.g}</strong>` : live ? 'kein Tipp' : '<a href="tippspiel.html" style="color:var(--accent);font-weight:700">Jetzt tippen →</a>'}
          · <a href="aufstellung.html?team=${encodeURIComponent(v[0])}" style="color:var(--accent)">Voraussichtliche Elf</a></p></section>`;
    }

    function alarmBox() {
      const ids = (daten.favoriten || []).map(String).filter(i => kurz[i]);
      const z = ids.map(i => ({ i, g: auffaellig(i) })).filter(x => x.g.length);
      if (!ids.length) return '';
      return `<section class="mb-box"><h2>🔔 Aufgefallen bei deinen Favoriten</h2><p class="cs-hinweis">Marktwert-Sprünge (ab 4 % am Tag oder 8 % in der Woche), Verletzungen und fragliche Einsätze.</p>
        ${z.length ? `<div class="mb-liste">${z.map(x => `<a href="spieler/${esc(kurz[x.i].s)}.html"><span><strong>${esc(kurz[x.i].n)}</strong><br><small style="color:var(--text3)">${esc(x.g.join(' · '))}</small></span></a>`).join('')}</div>` : '<p class="cs-leer">Alles ruhig, nichts Auffälliges.</p>'}</section>`;
    }

    function favBox() {
      const ids = (daten.favoriten || []).map(String).filter(i => kurz[i]);
      const zeilen = ids.map(i => {
        const k = kurz[i], n = news[i] || [], d = kbVon(k), a = aufVon(k);
        const kbText = d ? `Kickbase ${mio(d.mw)} (<span style="color:${d.d >= 0 ? '#4caf50' : '#e53935'}">${pf(prozent(d.d, d.mw))}</span> heute, ${pf(prozent(d.w, d.mw))} Woche) · ${d.p} Pkt.` : '';
        const aufText = a && AMPEL[a.ampel] ? `${AMPEL[a.ampel][0]} ${AMPEL[a.ampel][1]}${a.prozent ? ' (' + a.prozent + ' %)' : ''}` : '';
        return `<div class="mb-fav"><img src="logos/${esc(k.l)}.png" alt="">
          <div style="flex:1;min-width:0"><a class="mb-name" href="spieler/${esc(k.s)}.html">${esc(k.n)}</a>
          <div class="mb-sub">${esc(k.p)} · ${esc(k.v)}${k.mw ? ' · ' + esc(k.mw) : ''}</div>
          ${kbText || aufText ? `<div class="mb-sub" style="margin-top:3px">${[kbText, aufText].filter(Boolean).join(' · ')}</div>` : ''}
          <div class="mb-news">${n.slice(0, 3).map(a => `<a href="${esc(a.pfad)}">${esc(a.titel)} <small style="color:var(--text4)">${esc((a.datum || '').split(' ')[0])}</small></a>`).join('') || '<span style="color:var(--text4)">Keine aktuellen Meldungen</span>'}</div></div>
          <button class="mb-weg" data-id="${i}" title="Entfernen">✕</button></div>`;
      }).join('');
      return `<section class="mb-box"><h2>⭐ Meine Favoriten</h2><p class="cs-hinweis">Neues zu deinen Spielern. Auf jeder Spielerseite fügst du mit „Zu Favoriten“ weitere hinzu.</p>
        ${zeilen || '<p class="cs-leer">Noch keine Favoriten. Öffne eine Spielerseite oder suche einen Spieler unten.</p>'}
        <div style="margin-top:12px"><input id="mb-suche" class="mb-select" placeholder="Spieler suchen …" autocomplete="off" style="min-width:260px">
        <div id="mb-treffer" class="mb-liste"></div></div></section>`;
    }

    const tools = `<section class="mb-box"><h2>🧰 Deine Tools</h2><div class="mb-tools">
      <a href="tippspiel.html">🎯 Tippspiel<small>Tippen und Punkte sammeln</small></a>
      <a href="elf.html">⚽ Meine Elf<small>Aufstellung bauen, speichern, teilen</small></a>
      <a href="kickbase.html">📈 Kickbase-Stats<small>Marktwerte und Trends</small></a>
      <a href="comunio.html">📊 Comunio-Stats<small>Punkte und Preise</small></a>
      <a href="aufstellung.html">📋 Aufstellungen<small>Voraussichtliche Startelf</small></a>
      <a href="forum.html">💬 Forum<small>Mitdiskutieren</small></a>
      <a href="community.html">🏆 Community-Stats<small>Ranglisten und Top-Kommentare</small></a></div></section>`;

    function zeichnen() {
      sub.textContent = 'Willkommen zurück';
      box.innerHTML = vereinBox() + naechstesSpielBox() + tippBox() + alarmBox() + favBox() + tools;
      document.getElementById('mb-verein').onchange = async e => {
        try { await loKonto.verein(e.target.value); daten.verein = e.target.value; } catch (err) { alert(err.message); }
        zeichnen();
      };
      box.querySelectorAll('.mb-weg').forEach(b => b.onclick = async () => {
        try { const d = await loKonto.favorit(b.dataset.id); daten.favoriten = d.favoriten; } catch (err) { alert(err.message); }
        zeichnen();
      });
      const s = document.getElementById('mb-suche');
      s.oninput = () => {
        const q = s.value.trim().toLowerCase();
        const t = document.getElementById('mb-treffer');
        if (q.length < 2) { t.innerHTML = ''; return; }
        const hit = Object.entries(kurz).filter(([, k]) => k.n.toLowerCase().includes(q)).slice(0, 8);
        t.innerHTML = hit.map(([i, k]) => `<a href="#" data-id="${i}"><span>${esc(k.n)} <small>${esc(k.v)}</small></span><small>${(daten.favoriten || []).map(String).includes(i) ? '★ Favorit' : '+ hinzufügen'}</small></a>`).join('');
        t.querySelectorAll('a').forEach(a => a.onclick = async ev => {
          ev.preventDefault();
          try { const d = await loKonto.favorit(a.dataset.id); daten.favoriten = d.favoriten; } catch (err) { alert(err.message); }
          zeichnen();
        });
      };
    }

    async function start() {
      const u = netlifyIdentity.currentUser();
      if (!u) return gast();
      try {
        const j = u => fetch(u).then(r => r.json()).catch(() => ({}));
        const [d, f, n, k, b, a, t, r] = await Promise.all([loKonto.laden(), j('feed.json'), j('spieler_news.json'), j('spieler_kurz.json'), j('kickbase_spieler.json'), j('aufstellung.json'),
          loKonto.api('tipp_meine').catch(() => ({ tipps: {}, punkte: 0 })), j('/api?tipp_rangliste=1')]);
        daten = d || daten; feed = Array.isArray(f) ? f : []; news = n; kurz = k; kb = b; auf = a; tipp = t; rang = r.rangliste ? r : rang;
        try { spieltagSpiele = await (await fetch('https://api.openligadb.de/getmatchdata/bl1/2026/' + (rang.aktueller_spieltag || 1))).json(); } catch (e) { spieltagSpiele = []; }
        zeichnen();
      } catch (e) { sub.textContent = 'Konnte nicht geladen werden. Bitte Seite neu laden.'; }
    }
    netlifyIdentity.on('login', start);
    netlifyIdentity.on('logout', gast);
    setTimeout(() => { if (!box.innerHTML) start(); }, 1200);
    netlifyIdentity.on('init', u => { if (!u) gast(); else start(); });
  })();
  </script>

</body>
</html>
